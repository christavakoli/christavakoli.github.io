<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="home-matrix">
  <canvas id="matrixCanvas"></canvas>

  <div class="matrix-page-overlay"></div>

  <header class="matrix-topbar">
    <div class="container nav nav-dark">
      <a href="index.html" class="logo-image-link">
        <div class="logo-frame logo-frame-matrix">
          <img src="logowebsite1.png" alt="Logo" class="site-logo-image site-logo-image-matrix" />
        </div>
      </a>

      <nav class="nav-links nav-links-dark">
        <a href="index.html" class="active">Home</a>
        <a href="market.html">Market</a>
        <a href="forsale.html">For Sale</a>
        <a href="blog.html">Blog</a>
        <a href="projects.html">Projects</a>
      </nav>
    </div>
  </header>

  <main class="matrix-hero">
    <div class="container">
      <div class="matrix-hero-content">
        <h1>Welcome</h1>
        <p>directory above</p>
      </div>
    </div>
  </main>

  <footer class="site-footer footer-dark matrix-footer">
    <div class="container">
      <p>© 2026</p>
    </div>
  </footer>

  <script>
    const canvas = document.getElementById("matrixCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = Math.max(document.documentElement.scrollHeight, window.innerHeight);
    }

    const letters = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const chars = letters.split("");
    const fontSize = 16;
    let columns;
    let drops;

    function setupMatrix() {
      columns = Math.floor(canvas.width / fontSize);
      drops = Array(columns).fill(1);
    }

    function drawMatrix() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = fontSize + "px monospace";

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        const x = i * fontSize;
        const y = drops[i] * fontSize;

        ctx.fillStyle = "#39ff14";
        ctx.fillText(text, x, y);

        if (y > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }

        drops[i]++;
      }
    }

    function initializeMatrix() {
      resizeCanvas();
      setupMatrix();
    }

    initializeMatrix();
    setInterval(drawMatrix, 42);

    window.addEventListener("resize", () => {
      initializeMatrix();
    });
  </script>
</body>
</html>
