  <script>
    const canvas = document.getElementById("mazeCanvas");
    const ctx = canvas.getContext("2d");

    let width, height, offset = 0;

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }

    function drawMaze() {
      ctx.fillStyle = "#07090e";
      ctx.fillRect(0, 0, width, height);

      const size = 40;
      const cols = Math.ceil(width / size) + 2;
      const rows = Math.ceil(height / size) + 2;

      offset += 0.5;
      if (offset >= size) offset = 0;

      ctx.lineWidth = 2;

      for (let r = -1; r < rows; r++) {
        for (let c = -1; c < cols; c++) {
          const x = c * size - (offset % size);
          const y = r * size + (offset % size);

          const pattern = Math.sin((c + r) * 0.5) > 0;
          const hue = (c * 10 + r * 10 + offset * 2) % 360;
          
          ctx.strokeStyle = `hsla(${hue}, 40%, 25%, 0.45)`;

          ctx.beginPath();
          if (pattern) {
            ctx.moveTo(x, y);
            ctx.lineTo(x + size, y + size);
            ctx.moveTo(x + size / 2, y);
            ctx.lineTo(x + size, y + size / 2);
          } else {
            ctx.moveTo(x + size, y);
            ctx.lineTo(x, y + size);
            ctx.moveTo(x + size / 2, y + size);
            ctx.lineTo(x, y + size / 2);
          }
          ctx.stroke();
        }
      }

      requestAnimationFrame(drawMaze);
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    drawMaze();
  </script>
</body>
